[project]
name = "brindavan-pg-management-backend"
version = "0.1.0"
description = "FastAPI backend for Brindavan Elite PG for Gents management system"
readme = "../README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "firebase-admin>=6.5.0",
    "python-multipart>=0.0.9",
    "openpyxl>=3.1.5",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "httpx>=0.27.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
